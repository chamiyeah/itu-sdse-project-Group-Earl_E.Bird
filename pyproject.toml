[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "vial-classifier"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "torch",
    "torchvision",
    "numpy",
    "pandas",
    "scikit-learn",
    "pillow",
    "mlflow",
    "boto3",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "slow: test lenti (pipeline completa, equivalenza con il notebook, dati reali)",
]
